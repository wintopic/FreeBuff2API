name: Build Windows launcher

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 9.0.x

      - name: Prepare Node.js runtime
        shell: pwsh
        run: ./scripts/prepare-launcher-runtime.ps1

      - name: Publish launcher
        shell: pwsh
        run: |
          dotnet publish launcher/FreeBuffLauncher.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            --output dist/FreeBuffDesktopAssistant

      - name: Create archive
        id: archive
        shell: pwsh
        run: |
          $archive = "FreeBuffDesktopAssistant-${{ github.ref_name }}-win-x64.zip"
          Compress-Archive -Path dist/FreeBuffDesktopAssistant/* -DestinationPath $archive -CompressionLevel Optimal
          "path=$archive" >> $env:GITHUB_OUTPUT

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: FreeBuffDesktopAssistant-win-x64
          path: ${{ steps.archive.outputs.path }}
          if-no-files-found: error

      - name: Attach archive to tagged release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHIVE_PATH: ${{ steps.archive.outputs.path }}
        run: |
          gh release view "${{ github.ref_name }}" 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload "${{ github.ref_name }}" "$env:ARCHIVE_PATH" --clobber
          } else {
            gh release create "${{ github.ref_name }}" "$env:ARCHIVE_PATH" --generate-notes --title "${{ github.ref_name }}"
          }
