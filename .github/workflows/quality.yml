name: Quality checks

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gateway:
    name: Gateway and container
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Check gateway and model status behavior
        run: npm test

      - name: Validate Compose configuration
        run: |
          cp .env.example .env
          mkdir -p credentials
          docker compose config --quiet

      - name: Build container image
        run: docker build --tag freebuff2api:ci .

  windows-launcher:
    name: Windows launcher
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 9.0.x

      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          $parseErrors = @()
          Get-ChildItem -Path . -Filter *.ps1 -Recurse | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            $parseErrors += $errors
          }
          if ($parseErrors.Count -gt 0) {
            $parseErrors | Format-List | Out-String | Write-Error
            exit 1
          }

      - name: Build launcher
        run: dotnet build launcher/FreeBuffLauncher.csproj --configuration Release
