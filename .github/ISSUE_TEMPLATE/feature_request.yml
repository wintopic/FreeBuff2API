name: 功能建议
description: 提议兼容性、部署、文档或桌面体验改进
title: "[Feature] "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: 使用场景
      description: 当前遇到了什么限制，谁会受益
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 希望项目如何工作，可附脱敏示例
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 已考虑的替代方案

  - type: checkboxes
    id: scope
    attributes:
      label: 范围确认
      options:
        - label: 该建议不会要求提交、记录或共享真实账号凭据
          required: true
        - label: 我理解模型和额度最终由上游服务决定
          required: true
