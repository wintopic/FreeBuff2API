name: Bug 报告
description: 报告可复现的接口、部署或桌面启动器问题
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        提交前请删除 token、API key、邮箱、Cookie、完整请求头和其他敏感信息。

  - type: input
    id: version
    attributes:
      label: 版本
      description: healthz 返回的版本、提交哈希或 Release 版本
      placeholder: 1.9.1 / abc1234
    validations:
      required: true

  - type: dropdown
    id: deployment
    attributes:
      label: 部署方式
      options:
        - Windows 图形启动器
        - Windows PowerShell 本地启动
        - Node.js 直接启动
        - Docker / Compose
        - Cloudflare Worker
        - 其他
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 实际发生了什么，预期结果是什么
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 启动服务
        2. 调用某个路由
        3. 收到某个状态码
    validations:
      required: true

  - type: textarea
    id: diagnostics
    attributes:
      label: 脱敏诊断信息
      description: 可附状态码、错误消息和已脱敏日志；不要粘贴真实凭据
      render: text

  - type: checkboxes
    id: safety
    attributes:
      label: 安全确认
      options:
        - label: 我已确认内容中不含 authToken、API key、邮箱、Cookie 或其他真实凭据
          required: true
        - label: 我已停止其他可能占用同一 FreeBuff 账号的客户端
          required: true
