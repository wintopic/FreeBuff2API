services:
  freebuff2api:
    build: .
    image: freebuff2api:local
    container_name: freebuff2api
    restart: unless-stopped
    ports:
      - "8877:8787"
    env_file:
      - .env
    environment:
      PORT: "8787"
      HOST: "0.0.0.0"
      HTTP_PROXY: "${DOCKER_PROXY:-}"
      HTTPS_PROXY: "${DOCKER_PROXY:-}"
      ALL_PROXY: "${DOCKER_PROXY:-}"
      NO_PROXY: "${NO_PROXY:-127.0.0.1,localhost}"
      NODE_USE_ENV_PROXY: "1"
      FREE_PROXY_ACCOUNTS: "${FREE_PROXY_ACCOUNTS:-0}"
      FREEBUFF_MANAGEMENT_API: "0"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./credentials:/app/credentials:ro
